# Render Blueprint — optional one-click backend deploy.
# Docs: https://render.com/docs/blueprint-spec
# You can also create a Web Service manually; see docs/DEPLOYMENT.md.

services:
  - type: web
    name: repopulse-ai-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: EXTRA_CORS_ORIGINS
        sync: false
